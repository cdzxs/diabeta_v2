<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="diabeta-logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Records - DiaBeta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="records-page">

    <main class="page-shell">

        <!-- HEADER -->
        <header class="result-header">

            <a
                class="brand-mark"
                href="index.html"
                aria-label="DiaBeta home"
            >
                <img src="diabeta-logo.png" alt="DiaBeta logo">
                <span>DiaBeta</span>
            </a>

            <button
                class="nav-toggle"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                data-drawer-toggle
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- DESKTOP NAVIGATION -->
            <nav class="top-nav" aria-label="Main navigation">

                <a href="stage1.html">
                    Assessment
                </a>

                <a href="records.html">
                    Records
                </a>

                <a href="about.html">
                    About
                </a>

                <a href="about_me.html">
                    About Me
                </a>

            </nav>

        </header>


        <!-- MOBILE OVERLAY -->
        <div
            class="drawer-overlay"
            aria-hidden="true"
        ></div>


        <!-- MOBILE DRAWER -->
        <aside
            class="side-drawer"
            aria-hidden="true"
        >

            <button
                class="drawer-close"
                type="button"
                aria-label="Close navigation menu"
                data-drawer-close
            >
                &times;
            </button>

            <nav
                class="drawer-nav"
                aria-label="Mobile navigation"
            >

                <a href="stage1.html">
                    Assessment
                </a>

                <a href="records.html">
                    Records
                </a>

                <a href="about.html">
                    About
                </a>

                <a href="about_me.html">
                    About Me
                </a>

            </nav>

        </aside>


        <!-- PAGE HEADER -->
        <section class="page-hero">

            <p class="eyebrow">
                Saved locally
            </p>

            <h1>
                Assessment records
            </h1>

            <p>
                Your previous assessments are stored in this browser only.
                You can clear them at any time.
            </p>

            <button
                class="secondary-action"
                type="button"
                data-clear-records
            >
                Clear Records
            </button>

        </section>


        <!-- RECORDS -->
        <section
            class="records-list"
            id="recordsList"
            aria-live="polite"
        ></section>

    </main>


    <!-- RECORD MODAL -->
    <div
        class="record-modal"
        id="recordModal"
        hidden
    >

        <div
            class="record-modal-panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="recordModalTitle"
        >

            <button
                class="modal-close"
                type="button"
                data-close-record
            >
                Close
            </button>

            <div id="recordModalContent"></div>

        </div>

    </div>


    <!-- HEADER HEIGHT -->
    <script>
        (function () {

            function setHeaderHeight() {

                const header = document.querySelector(
                    '.assessment-header, .result-header'
                );

                if (!header) return;

                const height = header.offsetHeight;

                document.documentElement.style.setProperty(
                    '--header-h',
                    (height + 16) + 'px'
                );
            }

            window.addEventListener(
                'load',
                setHeaderHeight
            );

            window.addEventListener(
                'resize',
                setHeaderHeight
            );

        })();
    </script>


    <!-- APP JAVASCRIPT -->
    <script src="app.js"></script>

</body>
</html>
